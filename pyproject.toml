[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality"
version = "0.7.0"
description = "Standalone data quality rule validation and lineage tracing"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Data Quality" }]

[project.scripts]
dq = "data_quality.cli:main"

[tool.setuptools]
packages = ["data_quality"]
